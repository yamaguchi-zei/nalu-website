<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lounge Nalu</title>

<style>
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #fff;
    background: url("wave.jpg") no-repeat center center fixed;
    background-size: cover;
  }

  .overlay {
    background: rgba(0, 0, 40, 0.55);
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 80px 20px 40px;
  }

  header h1 {
    font-size: 3rem;
    letter-spacing: 0.15em;
    margin: 0;
  }

  main {
    max-width: 800px;
    margin: auto;
    padding: 0 20px 60px;
  }

  h2 {
    border-bottom: 1px solid #aaa;
    padding-bottom: 6px;
    margin-top: 40px;
    font-size: 1.6rem;
  }

  p {
    line-height: 1.9;
    font-size: 1.1rem;
  }

  .links {
    margin-top: 30px;
    text-align: center;
  }

  .links a {
    display: inline-block;
    margin: 10px;
    padding: 12px 25px;
    background: rgba(255,255,255,0.2);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    transition: 0.3s;
  }

  .links a:hover {
    background: rgba(255,255,255,0.35);
  }

  /* スマホ最適化 */
  @media screen and (max-width: 600px) {
    body {
      font-size: 18px;
    }

    header {
      padding: 60px 15px 30px;
    }

    header h1 {
      font-size: 2.4rem;
    }

    h2 {
      font-size: 1.4rem;
    }

    p {
      font-size: 1.1rem;
    }

    .links a {
      display: block;
      width: 80%;
      margin: 10px auto;
      font-size: 1rem;
    }
  }
</style>
</head>

<body>
<div class="overlay">

<header>

  <!-- 横並びロゴ（Nalu文字 ＋ 椰子の木） -->
  <div style="display:flex; justify-content:center; align-items:flex-end; gap:16px; margin-bottom:30px;">
    <img src="Nalu-logo01.png" alt="Nalu ロゴ文字"
         style="height:140px; width:auto;">
    <img src="Nalu-logo02.png" alt="Nalu 椰子の木ロゴ"
         style="height:70px; width:auto; margin-bottom:40px;">
  </div>

  <h1>Lounge Nalu</h1>
</header>

<main>

  <!-- 店舗写真 -->
  <img src="imag.jpg" alt="店舗写真" style="width:100%; max-width:600px; display:block; margin:0 auto 25px; border-radius:10px;">

  <section>
    <h2>ご紹介</h2>
    <p>
      Lounge Nalu（ナル）は、水戸市大工町にある落ち着いた雰囲気のラウンジです。<br>
      ゆったりとした時間をお過ごしいただける空間をご用意しております。
      <br><br>
      紹介制、会員制になっております。
    </p>
  </section>

  <section>
    <h2>店舗情報</h2>
    <p>
      営業日：月〜土<br>
      営業時間：20:00〜LAST<br>
      住所：水戸市泉町3丁目5-3 二番街ビル2階
    </p>
  </section>

  <div class="links">
    <a href="recruit.html">求人情報はこちら</a>
  </div>

</main>

</div>
</body>
</html>
