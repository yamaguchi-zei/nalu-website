<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Lounge Nalu</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #ffffff;
    }
    body {
      /* 背景の波画像を全面に固定表示 */
      background-image: url("wave.jpg"); /* ←ここに波の画像ファイル名 */
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .overlay {
      /* 読みやすくするための薄いオーバーレイ */
      background: rgba(0, 0, 40, 0.45);
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 80px 20px 40px;
    }
    header h1 {
      font-size: 3rem;
      letter-spacing: 0.2em;
      margin: 0 0 10px;
    }
    header p.sub {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.8;
    }
    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }
    section {
      margin-bottom: 40px;
    }
    h2 {
      font-size: 1.4rem;
      border-bottom: 1px solid rgba(255,255,255,0.4);
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
    p {
      line-height: 1.8;
      font-size: 0.95rem;
    }
    .links {
      text-align: center;
      margin-top: 40px;
    }
    .links a {
      display: inline-block;
      margin: 0 10px;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid #ffffff;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.25);
    }
    .links a:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    footer {
      text-align: center;
      font-size: 0.75rem;
      opacity: 0.7;
      padding-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <header>
      <h1>Lounge Nalu</h1>
      <p class="sub">ハワイ語で「波」 ― 紹介制・会員制ラウンジ</p>
    </header>

    <main>
      <section>
        <h2>ご紹介</h2>
        <p>
          Lounge Nalu は、紹介制・会員制の大人のためのラウンジです。<br>
          落ち着いた照明と静かな時間が流れる空間で、<br>
          大切な方とのひとときをゆっくりとお過ごしください。<br>
          ゆるやかな波のように、心ほどける時間をお届けいたします。
        </p>
      </section>

      <!-- 店内写真は後日ここにギャラリーとして追加可能 -->

<section>
  <h2>店舗情報</h2>
  <p>
    住所：水戸市大工町<br>
    営業日：月〜土（※定休日があれば変更できます）<br>
    営業時間：20:00〜LAST
  </p>
</section>

      
      <div class="links">
        <a href="recruit.html">求人情報はこちら</a>
        <a href="mailto:info@example.com?subject=Lounge%20Nalu%20お問い合わせ&amp;body=お問い合わせ内容をご記入ください。">
          メールでお問い合わせ
        </a>
      </div>
    </main>

    <footer>
      &copy; Lounge Nalu
    </footer>
  </div>
</body>
</html>
